<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>서울 대장아파트 지식테스트</title>
  <link rel="icon" href="/seoul.png"/>
  <style>
    :root{--gold:#FFD700;--gold-dim:#7a6300;--bg:#080808;--card:#111;--border:#232323;--green:#22c55e;--red:#ef4444;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:var(--bg);color:#fff;font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;}

    .screen{display:none;flex-direction:column;align-items:center;min-height:100dvh;position:relative;z-index:1;}
    .screen.active{display:flex;}

    /* ══ 시작 화면 ══ */
    #s-start{justify-content:center;text-align:center;padding:2rem;background:transparent;}
    .giphy-bg{position:fixed;inset:0;z-index:0;overflow:hidden;}
    .giphy-bg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.62);}
    .giphy-bg iframe{
      position:absolute;top:50%;left:50%;
      height:100dvh;width:calc(100dvh * 343 / 480);
      min-width:100%;
      transform:translate(-50%,-50%);
      border:0;pointer-events:none;
    }
    .start-eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:1.2rem;}
    #s-start h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:900;line-height:1.15;margin-bottom:.6rem;}
    #s-start h1 .hl{color:var(--gold);}
    .start-sub{font-size:1rem;color:#999;line-height:1.7;margin-bottom:2.5rem;}
    .start-sub strong{color:#fff;}
    @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 30px rgba(255,215,0,.3);}50%{transform:scale(1.06);box-shadow:0 0 50px rgba(255,215,0,.6);}}
    .btn-gold{background:var(--gold);color:#000;border:none;border-radius:50px;padding:1rem 3rem;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 0 30px rgba(255,215,0,.3);animation:pulse 2s ease-in-out infinite;}
    .btn-gold:hover{animation:none;transform:translateY(-3px);box-shadow:0 0 50px rgba(255,215,0,.5);}
    .q-slider-wrap{margin-top:2rem;width:100%;max-width:280px;}
    .q-slider-label{font-size:2rem;font-weight:900;color:var(--gold);text-align:center;margin-bottom:.5rem;}
    .q-slider-wrap input[type=range]{width:100%;accent-color:var(--gold);height:4px;cursor:pointer;}
    .q-slider-ends{display:flex;justify-content:space-between;font-size:.75rem;color:#666;margin-top:.3rem;}

    /* ══ 퀴즈 화면 ══ */
    #s-quiz{padding:.5rem 1rem .8rem;max-width:520px;width:100%;margin:0 auto;
            min-height:0;height:100dvh;overflow:hidden;}

    .hud{display:flex;align-items:center;gap:.8rem;width:100%;margin-bottom:.5rem;}
    .btn-home{background:none;border:none;padding:.2rem .3rem;cursor:pointer;line-height:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:.75;}
    .btn-home:hover{opacity:1;}
    .hud-score{font-size:.8rem;font-weight:700;color:var(--gold);min-width:80px;}
    .hud-score b{font-size:1.3rem;}
    .prog-wrap{flex:1;height:4px;background:#222;border-radius:10px;overflow:hidden;}
    .prog-fill{height:100%;background:var(--gold);border-radius:10px;transition:width .5s ease;}
    .hud-qnum{font-size:.8rem;color:#fff;min-width:36px;text-align:right;}
    .combo-bar{height:1.3rem;width:100%;text-align:center;font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:.3rem;letter-spacing:.04em;}

    /* 아파트 카드 */
    .apt-card{width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--border);margin-bottom:.9rem;}

    /* 사진 영역 */
    .apt-img-wrap{width:100%;height:20vh;position:relative;overflow:hidden;background:#0d1117;}
    .apt-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
    /* 사진 없을 때 플레이스홀더 */
    .apt-img-placeholder{
      width:100%;height:100%;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#0d1117 0%,#1a1a2e 50%,#16213e 100%);
      color:#444;font-size:.85rem;gap:.5rem;
    }
    .apt-img-placeholder .ph-icon{font-size:2.5rem;}

    .apt-info{background:var(--card);padding:.9rem 1.1rem 1rem;}
    .apt-name{font-size:1.45rem;font-weight:900;margin-bottom:.45rem;letter-spacing:-.02em;}
    .chips{display:flex;gap:.45rem;flex-wrap:wrap;}
    .chip{font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:20px;background:#1a1a1a;border:1px solid #2a2a2a;color:#888;}

    .question-label{font-size:.9rem;font-weight:600;color:#aaa;text-align:center;margin-bottom:.7rem;}

    /* 서울 지도 */
    .map-wrap{width:100%;position:relative;flex:1;min-height:0;}
    .seoul-svg{width:100%;height:100%;display:block;cursor:pointer;}
    .seoul-svg .gu{fill:#2a2a2a;stroke:#444;stroke-width:1.5;transition:fill .12s;}
    .seoul-svg .gu:hover{fill:#3a3500;}
    .seoul-svg .labels{fill:#ccc;font-size:13px;font-weight:600;text-anchor:middle;pointer-events:none;}
    .seoul-svg .gu.selected-wrong{fill:#3a0505;stroke:var(--red);stroke-width:2;}
    .seoul-svg .gu.correct-answer{fill:#052512;stroke:var(--green);stroke-width:2.5;}
    .seoul-svg .gu.dimmed{fill:#1a1a1a;stroke:#222;}

    .answer-overlay{position:absolute;bottom:0;left:0;right:0;pointer-events:none;display:flex;flex-direction:column;gap:.4rem;padding:.5rem 0;}
    .feedback{width:100%;padding:.65rem 1rem;border-radius:10px;font-size:.9rem;font-weight:700;text-align:center;line-height:1.5;display:none;pointer-events:auto;}
    .feedback.correct{background:#052512;border:1px solid var(--green);color:var(--green);display:block;}
    .feedback.wrong  {background:#1f0202;border:1px solid var(--red);  color:var(--red);  display:block;}
    .btn-next{width:100%;background:var(--gold);color:#000;border:none;border-radius:50px;padding:.85rem;font-size:1rem;font-weight:800;cursor:pointer;display:none;pointer-events:auto;}
    .btn-next.show{display:block;}
    .btn-next:hover{opacity:.85;}

    /* ══ 결과 화면 ══ */
    #s-result{justify-content:center;text-align:center;padding:2rem;background:transparent;}
    .grade{font-size:5.5rem;font-weight:900;color:var(--gold);line-height:1;filter:drop-shadow(0 0 24px rgba(255,215,0,.4));margin-bottom:.3rem;}
    .grade-sub{font-size:1rem;color:#888;margin-bottom:.8rem;}
    .grade-sub b{color:#fff;font-size:1.3rem;}
    #r-title{font-size:1.5rem;font-weight:800;margin-bottom:.4rem;}
    #r-msg{font-size:.9rem;color:#888;line-height:1.7;margin-bottom:1.8rem;max-width:320px;}
    .result-btns{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem;}
    .btn-outline{background:transparent;color:#fff;border:2px solid #333;border-radius:50px;padding:.85rem 1.8rem;font-size:.95rem;font-weight:700;cursor:pointer;transition:border-color .15s;}
    .btn-outline:hover{border-color:#555;}
    .log-wrap{width:100%;max-width:320px;text-align:left;}
    .log-title{font-size:.72rem;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;}
    .log-row{display:flex;justify-content:space-between;font-size:.85rem;padding:.3rem 0;border-bottom:1px solid #161616;}
    .log-apt{color:#bbb;}
    .ok{color:var(--green);font-weight:700;}
    .ng{color:var(--red);font-weight:700;}

    @media(max-width:480px){
      .apt-img-wrap{height:160px;}
      .apt-name{font-size:1.25rem;}
      .seoul-svg .labels{font-size:16px;}
    }
    /* ══ 데스크탑: 퀴즈 확대 ══ */
    @media(min-width:768px){
      #s-quiz{width:min(92vw,960px);max-width:none;padding:.8rem 2rem 1rem;}
      .apt-img-wrap{height:22vh;}
    }
  </style>
</head>

  {name:"잠실동 잠실트리지움",          gu:"송파구",  units:2696,  year:2008, highlight:"잠실 4대 단지"},

  {name:"자양동 더샵스타시티",          gu:"광진구",  units:2678,  year:2003, highlight:"광진구 최고가 랜드마크"},
  {name:"염리동 마포프레스티지자이",     gu:"마포구",  units:3885,  year:2015, highlight:"마포 최대 브랜드 단지"},

  {name:"목동 목동신시가지14단지",       gu:"양천구",  units:2300,  year:1988, highlight:"목동 최대 규모 단지"},
  {name:"여의도동 브라이튼여의도",       gu:"영등포구", units:879,  year:2024, highlight:"여의도 최신 랜드마크"},
];

let TOTAL=10;
let qs=[],cur=0,score=0,log=[],answered=false;

const shuffle = a=>[...a].sort(()=>Math.random()-.5);

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── SVG 지도 클릭 이벤트 ──────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('#seoul-svg .gu').forEach(path=>{
    path.addEventListener('click',()=>{
      if(answered) return;
      pickAnswer(path.getAttribute('data-gu'));
    });
  });
});

function resetMap(){
  document.querySelectorAll('#seoul-svg .gu').forEach(p=>
    p.classList.remove('selected-wrong','correct-answer','dimmed'));
}

function applyMapResult(sel,correct){
  document.querySelectorAll('#seoul-svg .gu').forEach(p=>{
    const g=p.getAttribute('data-gu');
    if(g===correct) p.classList.add('correct-answer');
    else if(g===sel) p.classList.add('selected-wrong');
    else p.classList.add('dimmed');
  });
}

// ── 사진 로딩 ─────────────────────────────────────────
function setImage(name){
  const wrap=document.getElementById('apt-img-wrap');
  // images/아파트이름.jpg 파일을 시도. 없으면 placeholder
  const img=document.createElement('img');
  img.src=`images/${encodeURIComponent(name)}.jpg`;
  img.alt=name;
  img.onerror=()=>{
    wrap.innerHTML=`
      <div class="apt-img-placeholder">
        <span class="ph-icon">🏢</span>
        <span>사진 준비 중</span>
      </div>`;
  };
  wrap.innerHTML='';
  wrap.appendChild(img);
}

// ── 게임 흐름 ──────────────────────────────────────────
function startGame(){
  TOTAL=Math.max(1,parseInt(document.getElementById('q-slider').value));
  qs=shuffle(APTS).slice(0,TOTAL);
  cur=0;score=0;log=[];
  show('s-quiz');
  render();
}

function render(){
  answered=false;
  const q=qs[cur];

  document.getElementById('prog').style.width=(cur/TOTAL*100)+'%';
  document.getElementById('qnum').textContent=`${cur+1}/${TOTAL}`;
  document.getElementById('hud-pts').textContent=score;
  document.getElementById('combo-bar').textContent='';

  setImage(q.name);
  document.getElementById('apt-name').textContent=q.name;
  document.getElementById('apt-chips').innerHTML=
    `<span class="chip">${q.units.toLocaleString('ko-KR')}세대</span>`+
    `<span class="chip">${q.year}년 입주</span>`+
    `<span class="chip">${q.highlight}</span>`;

  resetMap();
  const fb=document.getElementById('feedback');
  fb.className='feedback'; fb.textContent='';
  document.getElementById('btn-next').className='btn-next';
}

let _autoTimer=null;

function playSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(type==='correct'){
      [523,659,784].forEach((freq,i)=>{
        const osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.connect(gain);gain.connect(ctx.destination);
        osc.type='sine';osc.frequency.value=freq;
        const t=ctx.currentTime+i*0.12;
        gain.gain.setValueAtTime(0.28,t);
        gain.gain.exponentialRampToValueAtTime(0.001,t+0.35);
        osc.start(t);osc.stop(t+0.35);
      });
    } else {
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sawtooth';osc.frequency.value=180;
      gain.gain.setValueAtTime(0.2,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.45);
      osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.45);
    }
  }catch(e){}
}

function pickAnswer(sel){
  if(answered) return;
  answered=true;
  clearTimeout(_autoTimer);
  const q=qs[cur];
  const ok=sel===q.gu;
  const fb=document.getElementById('feedback');
  if(ok){
    score+=10;
    playSound('correct');
    fb.textContent=`✅ 정답! ${q.gu}입니다. +10점`;
    fb.className='feedback correct';
    _autoTimer=setTimeout(nextQ, 1250);
  } else {
    playSound('wrong');
    fb.textContent=`❌ 오답! 정답은 ${q.gu}입니다.`;
    fb.className='feedback wrong';
    document.getElementById('btn-next').className='btn-next show';
  }
  applyMapResult(sel,q.gu);
  log.push({name:q.name,gu:q.gu,ok});
  document.getElementById('hud-pts').textContent=score;
}

function nextQ(){
  cur++;
  window.scrollTo({top:0,behavior:'instant'});
  if(cur>=TOTAL) showResult();
  else render();
}

function showResult(){
  document.getElementById('prog').style.width='100%';
  const correct=log.filter(r=>r.ok).length;
  let grade,title,msg;
  if(correct===TOTAL){grade='S';title='완벽한 서울 부동산 고수!';msg=`${TOTAL}문제 전부 정답! 진짜 전문가급 👑`;}
  else if(correct>=Math.round(TOTAL*0.8)){grade='A';title='거의 다 맞췄어요!';msg='강남 3구 뿐 아니라 다른 지역도 잘 아는 분이에요.';}
  else if(correct>=Math.round(TOTAL*0.6)){grade='B';title='절반 이상 맞췄어요!';msg='강남은 완벽한데 다른 지역이 조금 헷갈리나요?';}
  else if(correct>=Math.round(TOTAL*0.4)){grade='C';title='더 공부가 필요해요!';msg='서울 곳곳의 대장아파트를 더 알아보세요.';}
  else{grade='D';title='다시 도전해보세요!';msg='힌트를 잘 보면 맞출 수 있어요!';}
  document.getElementById('r-grade').textContent=grade;
  document.getElementById('r-pts').textContent=score;
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-title').textContent=title;
  document.getElementById('r-msg').textContent=msg;
  document.getElementById('log-list').innerHTML=log.map(r=>
    `<div class="log-row"><span class="log-apt">${r.name}</span><span class="${r.ok?'ok':'ng'}">${r.ok?'✅ '+r.gu:'❌ '+r.gu}</span></div>`
  ).join('');
  show('s-result');
}

function shareResult(){
  const correct=log.filter(r=>r.ok).length;
  const text=`서울 대장아파트 지식테스트\n${correct}/10 정답 · 총 ${score}점\n🏠 나도 해봐! → playatgame.com`;
  navigator.clipboard.writeText(text)
    .then(()=>alert('결과가 복사됐어요! SNS에 붙여넣기 해보세요.'))
    .catch(()=>alert(text));
}

function goHome(){clearTimeout(_autoTimer);show('s-start');}
function retryGame(){show('s-start');}
</script>
